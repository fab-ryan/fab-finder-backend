<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Fab Finder Documentation</title>
    
    <!-- Modern Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/rapidoc/dist/rapidoc-min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0d1117;
      }
      rapi-doc {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <rapi-doc
      spec-url="/docs-json"
      theme="dark"
      render-style="focused"
      layout="row"
      
      regular-font="Outfit, sans-serif"
      mono-font="JetBrains Mono, monospace"
      
      primary-color="#032E9D"
      bg-color="#0d1117"
      text-color="#c9d1d9"
      header-color="#161b22"
      
      nav-bg-color="#161b22"
      nav-text-color="#8b949e"
      nav-hover-bg-color="#21262d"
      nav-hover-text-color="#c9d1d9"
      
      logo="https://solvit.africa/assets/solvit_logo-CXMW2Ny6.png"
      nav-logo="https://solvit.africa/assets/solvit_logo-CXMW2Ny6.png"
      
      show-header="true"
      allow-server-selection="true"
      allow-authentication="true"
      
      show-method-in-nav-bar="as-colored-text"
      use-path-in-nav-bar="true"
      nav-item-spacing="relaxed"
      default-schema-tab="model"
    >
    </rapi-doc>
  </body>
</html>
